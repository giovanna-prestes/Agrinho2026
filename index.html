<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Agronomia Sustentável</title>
    <style>
        :root {
            --agro-verde-escuro: #1e3f20; 
            --agro-verde-folha: #386641;  
            --agro-terra: #4a3728;         
            --agro-trigo: #f4efe2;        
            --agro-ouro: #bc6c25;          
            --white: #ffffff;
            --texto-escuro: #111111;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--agro-trigo); color: var(--texto-escuro); line-height: 1.7; }
        header {
            background: linear-gradient(rgba(30, 63, 32, 0.85), rgba(74, 55, 40, 0.9)), url('https://unsplash.com') no-repeat center center/cover;
            color: var(--white); text-align: center; padding: 100px 20px; border-bottom: 6px solid var(--agro-ouro);
        }
        header h1 { font-size: 3.2rem; margin-bottom: 20px; font-weight: 800; text-shadow: 2px 2px 5px rgba(0,0,0,0.6); }
        .container { max-width: 1200px; margin: 40px auto; padding: 0 25px; }
        h2.titulo-secao { color: var(--white); background-color: var(--agro-verde-escuro); margin-top: 50px; padding: 15px 20px; border-left: 8px solid var(--agro-ouro); border-radius: 4px; }
        .painel-precos { background: var(--white); padding: 40px; border-radius: 14px; box-shadow: 0 8px 25px rgba(74, 55, 40, 0.1); border: 1px solid rgba(188, 108, 37, 0.25); }
        .tabela-precos { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .tabela-precos th { background-color: var(--agro-verde-escuro); color: var(--white); padding: 18px; text-align: left; }
        .tabela-precos td { padding: 18px; border-bottom: 1px solid #e5dfd3; }
        .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 35px; margin-top: 30px; }
        .card { background: var(--white); border-radius: 14px; overflow: hidden; box-shadow: 0 8px 22px rgba(74, 55, 40, 0.07); transition: transform 0.3s; border: 1px solid rgba(74, 55, 40, 0.08); }
        .card:hover { transform: translateY(-10px); }
        .card img { height: 240px; object-fit: cover; width: 100%; border-bottom: 5px solid var(--agro-verde-folha); }
        .card-conteudo { padding: 28px; } /* Corrigido: '.' adicionado */
        .price-tag { display: inline-block; background-color: var(--agro-ouro); color: var(--white); padding: 10px 18px; border-radius: 4px; margin: 0 28px 28px; } /* Corrigido: '.' adicionado */
        footer { background-color: var(--agro-verde-escuro); color: #f2e8cf; text-align: center; padding: 50px; margin-top: 60px; }
    </style>
</head>
<body>
    <header>
        <h1>Tratado de Agronomia Sustentável</h1>
        <p>Ciência aplicada à regeneração da terra e blindagem econômica.</p>
    </header>
    <div class="container">
        <h2 class="titulo-secao">Indicadores de Mercado</h2>
        <div class="grid-cards">
            <div class="card">
                <img src="https://unsplash.com" alt="Gráfico de Mercado">
                <div class="card-conteudo">
                    <h3>Análise de Preços</h3>
                    <p>Valores médios negociados em tempo real.</p>
                </div>
                <span class="price-tag">Preço Médio Atual</span>
            </div>
        </div>
        <section class="painel-precos">
            <table class="tabela-precos">
                <thead><tr><th>Commodity</th><th>Preço</th></tr></thead>
                <tbody><tr><td>Soja (Saca 60kg)</td><td>R$ 142,80</td></tr></tbody>
            </table>
        </section>
    </div>
    <footer><p>&copy; 2026 Plataforma Agronomia Sustentável.</p></footer>
</body>
</html>
